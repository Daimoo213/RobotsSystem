name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-and-tools:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scheduler
          POSTGRES_PASSWORD: ci-database-password
          POSTGRES_DB: scheduler
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scheduler -d scheduler"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DEBUG: "true"
      JWT_SECRET: ci-jwt-signing-secret-not-for-production
      DEVICE_GATEWAY_API_KEY: ci-gateway-secret-not-for-production
      INITIAL_SETUP_TOKEN: ci-setup-secret-not-for-production
      PG_HOST: 127.0.0.1
      PG_PORT: "5432"
      PG_USER: scheduler
      PG_PASSWORD: ci-database-password
      PG_DB: scheduler
      REDIS_PASSWORD: ci-redis-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Verify migrations and backend
        working-directory: backend
        run: |
          alembic upgrade head
          alembic check
          python -m compileall -q app
          pytest -q
      - name: Verify deployment tooling
        run: pytest -q manager/tests
      - name: Build registry release fixture
        run: >-
          python manager/deploy.py package
          --registry-prefix ghcr.io/example/robots-system
          --version v0.0.0
          --output "${{ runner.temp }}/release-test"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: corepack enable
      - name: Install workspace dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build PM and O&M
        working-directory: frontend
        run: pnpm build

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell deployment scripts
        shell: powershell
        run: |
          $errors = @()
          foreach ($path in @('deploy/install.ps1', 'deploy/manage.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [void][Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path), [ref]$tokens, [ref]$parseErrors
            )
            $errors += $parseErrors
          }
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
